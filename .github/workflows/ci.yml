name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint installer
        run: shellcheck setup.sh

      - name: Run installer (configure only)
        run: |
          ./setup.sh --yes --no-start
          test -f .env || { echo ".env was not created"; exit 1; }
          grep -Eq '^MEILISEARCH_KEY=[0-9a-f]{64}$' .env || { echo "MEILISEARCH_KEY was not generated"; cat .env; exit 1; }
          grep -q '^API_PORT=3000$' .env && grep -q '^UI_PORT=80$' .env || { echo "default ports not written"; exit 1; }
          # Second run must keep the generated key
          cp .env .env.first && ./setup.sh --yes --no-start && cmp .env .env.first

      - name: Build Docker images
        run: docker compose build

      - name: Test Docker Compose
        run: |
          docker compose up -d
          # Wait up to 90s for the API (it connects to Meilisearch before listening)
          for i in $(seq 1 45); do
            if curl -fs http://localhost:3000/health; then echo; echo "API healthy"; break; fi
            if [ "$i" -eq 45 ]; then echo "API did not become healthy"; docker compose logs; exit 1; fi
            sleep 2
          done
          curl -fs http://localhost/api/categories > /dev/null && echo "UI proxy OK"
          docker compose down

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit
